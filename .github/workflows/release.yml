name: Release

# A release is cut whenever the `version` in Cargo.toml on `main` doesn't yet
# have a matching `v<version>` git tag. The `gate` job below detects that,
# creates the tag, and lets the build/release/crates jobs run in the SAME run.
#
# Why not a separate "auto-tag" workflow? Tags pushed with the default
# GITHUB_TOKEN do NOT trigger other workflows (GitHub blocks this to avoid
# recursion), so a tag-triggered release.yml would never fire. Keeping the
# detection + release in one workflow sidesteps that without needing a PAT.
#
# Pushing a `v*` tag by hand or running this manually still works:
#   - tag push     -> release that exact tag
#   - workflow_dispatch / main push -> release Cargo.toml's version if untagged
on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Decide whether there's anything to release, and what tag to release.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version tag
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full tag list to know what's already released

      - name: Decide whether to release
        id: decide
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.ref_type }}" = "tag" ]; then
            # Triggered by an explicit tag push: release exactly that tag.
            tag="${{ github.ref_name }}"
            echo "Tag push detected: releasing ${tag}."
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Branch push or manual dispatch: derive the tag from Cargo.toml.
          version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')"
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version ${version} with no ${tag} tag; tagging + releasing."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create version tag
        # Only when we derived a brand-new tag from Cargo.toml (not on tag push,
        # where the tag already exists).
        if: steps.decide.outputs.should_release == 'true' && github.ref_type != 'tag'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$TAG"
          git push origin "$TAG"

  build:
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, name: macos-arm64, asset: webview-macos-arm64, bin: webview }
          - { os: ubuntu-22.04, name: linux-x64, asset: webview-linux-x64, bin: webview }
          - { os: ubuntu-22.04-arm, name: linux-arm64, asset: webview-linux-arm64, bin: webview }
          - { os: windows-latest, name: windows-x64, asset: webview-windows-x64.exe, bin: webview.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install webview build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Install tools via mise
        uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.6.1
        with:
          version: 2026.5.3

      - name: Cache cargo build
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0

      - name: Build release binary
        run: cargo build --release

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"

      - name: Upload ${{ matrix.name }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: [gate, build]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload assets
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum webview-* > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            artifacts/webview-* \
            artifacts/SHA256SUMS

  crates:
    needs: [gate, build]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install webview build deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Install tools via mise
        uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.6.1
        with:
          version: 2026.5.3

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
